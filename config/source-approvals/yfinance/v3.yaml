conditions:
  - category: terms
    knowledge_status: known
    summary: Current Yahoo terms were reviewed and the repository owner confirmed completion of the required permission process for this limited use.
    official_reference_ids: [yahoo-terms, yahoo-ydn-guidelines]
  - category: pricing
    knowledge_status: known
    summary: Approval is limited to the permission-confirmed personal internal-analysis use; no paid provider plan is represented by this record.
    official_reference_ids: [yahoo-ydn-guidelines]
  - category: authentication
    knowledge_status: unsupported
    summary: The approved yfinance endpoint path has no project credential and no secret value may be stored in this record.
    official_reference_ids: [yfinance-docs]
  - category: redistribution
    knowledge_status: known
    summary: Raw Yahoo data redistribution is outside the approval; use is restricted to internal analysis.
    official_reference_ids: [yahoo-terms, yahoo-ydn-guidelines]
  - category: derived_output
    knowledge_status: known
    summary: Derived output is restricted to internal analysis and remains subject to evidence attribution and publication review.
    official_reference_ids: [yahoo-terms]
  - category: external_processing
    knowledge_status: known
    summary: External-Agent transfer is approved only for the minimum public information, verified evidence, and derived metrics needed for private internal analysis; bulk raw series, publication, and redistribution remain prohibited.
    official_reference_ids: [yahoo-terms]
  - category: provider_retention
    knowledge_status: unsupported
    summary: No private or confidential input is sent; provider-side public-request logging is not exposed as a configurable retention feature.
    official_reference_ids: [yahoo-ydn-guidelines]
  - category: provider_training
    knowledge_status: unsupported
    summary: No private or confidential input is sent and no provider training control is exposed by the approved endpoint path.
    official_reference_ids: [yahoo-terms]
  - category: freshness
    knowledge_status: known
    summary: No provider freshness SLA is assumed; every acquisition records its time and is validated against the evidence freshness policy.
    official_reference_ids: [yfinance-docs]
  - category: available_period
    knowledge_status: known
    summary: Available history is endpoint- and argument-dependent; the adapter must record the function, arguments, and returned period.
    official_reference_ids: [yfinance-docs]
  - category: rate_limit
    knowledge_status: known
    summary: No provider numeric limit is assumed; native-history policy v1 serializes library calls, spaces them ten seconds after completion, and persists a fifteen-minute failure cooldown.
    official_reference_ids: [yfinance-docs, yahoo-ydn-guidelines]
  - category: failure_behavior
    knowledge_status: known
    summary: Application and general network retries remain disabled; native authentication fallback is delegated to pinned yfinance. HTTP counts and Retry-After are not observed; failures stop acquisition and persist a conservative cooldown.
    official_reference_ids: [yfinance-docs, yahoo-ydn-guidelines]
