approval_id: public-web-source-approval
approval_version: 1
source_id: public-web
status: approved
provider: Public document publishers selected during research
service: Anonymous public HTML, text and PDF acquisition
dataset: Public documents requested by baseline preparation or research roles
reviewer: repository-owner
reviewed_on: "2026-11-14"
approved_by: repository-owner
effective_on: "2026-11-14"
recheck_due_on: "2026-12-24"
status_reason: Repository owner authorizes necessary low-frequency public research and private LLM processing under ADR-0007; this is not a representation of a publisher grant or redistribution license.
usage_entity: private_individual_internal_analysis
usage_purposes:
  - Necessary public document acquisition for private stock research
  - Private LLM analysis of necessary per-security facts
contract_plan: Review quarterly and on any public, commercial, third-party, or redistribution scope change.
credential_scope_alias: null
secret_value_storage_allowed: false
online_use_allowed: true
