conditions:
  - category: terms
    knowledge_status: known
    summary: Use is restricted to local internal analysis under the reviewed EDINET API guidance; material condition changes require reapproval.
    official_reference_ids: [edinet-api-guide]
  - category: pricing
    knowledge_status: known
    summary: The reviewed API guidance does not identify a paid plan for this approved path; no paid entitlement is represented.
    official_reference_ids: [edinet-api-guide]
  - category: authentication
    knowledge_status: known
    summary: API version 2 requires a subscription key, which must be loaded from the owner-only credential file only immediately before send.
    official_reference_ids: [edinet-api-specification-v2, edinet-api-guide]
  - category: redistribution
    knowledge_status: known
    summary: Provider raw is retained only as a local protected artifact and is not committed to Git or redistributed.
    official_reference_ids: [edinet-api-guide]
  - category: derived_output
    knowledge_status: known
    summary: Derived internal analysis must preserve filing provenance and remains subject to review before any publication.
    official_reference_ids: [edinet-api-guide]
  - category: external_processing
    knowledge_status: known
    summary: Provider raw and bulk filing content must not be transferred to an external Agent under this approval.
    official_reference_ids: [edinet-api-guide]
  - category: provider_retention
    knowledge_status: unsupported
    summary: No private analytical input is submitted and the reviewed API path exposes no configurable provider-retention control.
    official_reference_ids: [edinet-api-specification-v2]
  - category: provider_training
    knowledge_status: unsupported
    summary: No private analytical input is submitted and the reviewed API path exposes no provider-training control.
    official_reference_ids: [edinet-api-specification-v2]
  - category: freshness
    knowledge_status: known
    summary: Filing-list metadata is updated during service operation; each acquisition must record retrieval time and content identity.
    official_reference_ids: [edinet-api-specification-v2, edinet-api-guide]
  - category: available_period
    knowledge_status: known
    summary: Availability depends on the EDINET service and requested filing date; the adapter must retain the requested date and returned metadata.
    official_reference_ids: [edinet-api-specification-v2]
  - category: rate_limit
    knowledge_status: known
    summary: The local profile is conservatively restricted to one serialized request per sixty seconds.
    official_reference_ids: [edinet-api-guide]
  - category: failure_behavior
    knowledge_status: known
    summary: Transport, provider, limit, and parse failures stop safely without automatic retry, cache, or source fallback.
    official_reference_ids: [edinet-api-specification-v2]
