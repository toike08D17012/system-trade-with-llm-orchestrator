name: ${REPO_ROOT_BASENAME:-$REPO_NAME}

services:
  app:
    build:
      context: ..
      dockerfile: docker/Dockerfile
      args:
        REPO_NAME: ${REPO_NAME}
        USER_NAME: ${USER_NAME:-kujira}
        GROUP_NAME: ${GROUP_NAME:-kujira}
        USER_UID: ${USER_UID:-1000}
        USER_GID: ${USER_GID:-1000}
    image: ghcr.io/${GITHUB_REPOSITORY}:latest
    volumes:
      - .bash_history:/home/${USER_NAME:-kujira}/.bash_history
      - ../:/home/${USER_NAME:-kujira}/workspace/${REPO_NAME:?REPO_NAME is required}
      - type: bind
        source: ${HOST_CODEX_HOME:-${HOME}/.codex}
        target: /home/${USER_NAME:-kujira}/.codex
        bind:
          create_host_path: false
      - type: bind
        source: ${HOST_CLAUDE_HOME:-${HOME}/.claude}
        target: /home/${USER_NAME:-kujira}/.claude
        bind:
          create_host_path: false
      - type: bind
        source: ${HOST_CLAUDE_STATE_FILE:-${HOME}/.claude.json}
        target: /home/${USER_NAME:-kujira}/.claude.json
        bind:
          create_host_path: false
      - type: bind
        source: ${HOST_ANTIGRAVITY_HOME:-${HOME}/.gemini}
        target: /home/${USER_NAME:-kujira}/.gemini
        bind:
          create_host_path: false
    tty: true
    stdin_open: true
    network_mode: "host"
    working_dir: /home/${USER_NAME:-kujira}/workspace/${REPO_NAME:?REPO_NAME is required}
    command: ["bash"]
